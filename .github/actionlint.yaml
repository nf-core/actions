# See: https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  .github/workflows/fix-linting.yml:
    ignore:
      # actionlint (as of v1.7.12) predates GitHub's '$/' self-repository
      # action syntax (GA July 2026), and rejects it as a ref-less format.
      # See README.md's "Referencing the sibling actions". Remove this once
      # actionlint recognises '$/'.
      - 'specifying action "\$/actions/validate-patch" in invalid format because ref is missing'
  .github/workflows/release.yml:
    ignore:
      # Same '$/' gap as above, for the reusable workflow call to ci.yml.
      - 'reusable workflow call "\$/\.github/workflows/ci\.yml" at "uses" is not following the format'
