name: nf-test

# Reusable workflow: a pipeline calls this instead of keeping its own
# nf-test CI. See README.md for the pipeline stub and the .nf-core.yml keys
# it reads.
on:
  workflow_call:
    inputs:
      variant:
        description: >-
          Selects a test flavour for this call. '' (default) runs the full
          profile set from .nf-core.yml for a release pull request (base
          'master' or 'main'), and for 'release' and 'workflow_dispatch' events.
          Any other value (for example 'arm', 'gpu') always runs a single
          profile ('docker' when configured, otherwise the first configured
          profile), and 'gpu' also enables GPU-gated tests. Lets one pipeline
          call this workflow more than once, from separate stub files, for
          separate hardware.
        type: string
        required: false
        default: ''
      runner:
        description: >-
          RunsOn runner label override for this call, for example
          '4cpu-linux-arm64'. Forwarded to read-config's own 'runner' input, so
          it wins over '.nf-core.yml' the same way any read-config input does.
          Leave unset to use the repository's configured runner.
        type: string
        required: false
        default: ''
    secrets:
      SENTIEON_LICSRVR_IP:
        required: false
      SENTIEON_LICENSE_MESSAGE:
        required: false
      SENTIEON_ENCRYPTION_KEY:
        required: false

permissions:
  contents: read

jobs:
  # Resolves CI settings once, on a plain GitHub-hosted runner: it only reads
  # a file from the checkout, so it does not need the self-hosted runner pool
  # the heavier jobs below use. Its own runner can't depend on its output, so
  # it runs before, and separately from, the job that needs a config-driven
  # runner label.
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nf-test-version: ${{ steps.read-config.outputs.nf-test-version }}
      nextflow-versions: ${{ steps.read-config.outputs.nextflow-versions }}
      max-shards: ${{ steps.read-config.outputs.max-shards }}
      nf-test-workdir: ${{ steps.read-config.outputs.nf-test-workdir }}
      runner: ${{ steps.read-config.outputs.runner }}
      nf-core-version: ${{ steps.read-config.outputs.nf-core-version }}
      # The profile set for this specific run, not the raw config value, and
      # the changed-since value for it: see the 'Plan this run' step below.
      test-profiles: ${{ steps.plan-run.outputs.test-profiles }}
      changed-since: ${{ steps.plan-run.outputs.changed-since }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config
        with:
          runner: ${{ inputs.runner }}

      - name: Plan this run
        id: plan-run
        uses: $/actions/plan-run
        with:
          profiles: ${{ steps.read-config.outputs.profiles }}
          variant: ${{ inputs.variant }}
          event-name: ${{ github.event_name }}
          # nf-core pipelines default to 'master' and take pull requests into
          # 'dev'. A pull request whose base is 'master' or 'main' is a
          # release pull request; an ordinary pull request targets 'dev' and
          # never matches this.
          base-ref: ${{ github.base_ref }}

  # Runs an nf-test dry run to build the shard matrix. Named 'nf-test-changes'
  # to keep the check name pipelines already have in branch protection.
  nf-test-changes:
    name: nf-test-changes
    needs: config
    runs-on:
      - runs-on=${{ github.run_id }}-nf-test-changes
      - runner=${{ needs.config.outputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.get-shards.outputs.shards }}
      total-shards: ${{ steps.get-shards.outputs.total-shards }}
      has-tests: ${{ steps.get-shards.outputs.has-tests }}
    env:
      NFT_WORKDIR: ${{ needs.config.outputs.nf-test-workdir }}
    steps:
      # Purges the workspace in case this runner was reused from a previous job.
      - name: Clean workspace
        run: |
          rm -rf ./* ./.??* || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # nf-test's --changed-since (default HEAD^) needs history beyond
          # the last commit to resolve.
          fetch-depth: 0

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          # The dry run only needs one working Nextflow to enumerate tests;
          # it does not run the pipeline. Use the first configured version,
          # the same pinned action the 'nf-test' job uses.
          version: ${{ fromJSON(needs.config.outputs.nextflow-versions)[0] }}

      - name: Setup nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ needs.config.outputs.nf-test-version }}

      - name: Get shards
        id: get-shards
        uses: $/actions/get-shards
        with:
          max-shards: ${{ needs.config.outputs.max-shards }}
          # The shard count is enumerated once here, using only the first
          # entry of test-profiles, even though the 'nf-test' job below fans
          # out over every entry of test-profiles with this one
          # total-shards. This assumes nf-test selects tests by file and tag,
          # not by profile, so the count is the same for every profile. A
          # pipeline whose test selection varies by profile would break that
          # assumption. changed-since must match the 'nf-test' job's value: a
          # different value here could select a different test set than the
          # matrix runs, and the nf-test action treats zero tests as a hard
          # failure.
          profile: test,${{ fromJSON(needs.config.outputs.test-profiles)[0] }}
          changed-since: ${{ needs.config.outputs.changed-since }}

  # The test matrix. Skipped outright when the dry run found no tests, so
  # 'confirm-pass' below still succeeds instead of gating on a job that never
  # ran anything.
  nf-test:
    name:
      '${{ matrix.profile }} | ${{ matrix.nxf-version }} | shard ${{
      matrix.shard }}/${{ needs.nf-test-changes.outputs.total-shards }}'
    needs: [config, nf-test-changes]
    if: needs.nf-test-changes.outputs.has-tests == 'true'
    runs-on:
      - runs-on=${{ github.run_id }}-nf-test
      - runner=${{ needs.config.outputs.runner }}
      - volume=80gb
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.nf-test-changes.outputs.shards) }}
        nxf-version: ${{ fromJSON(needs.config.outputs.nextflow-versions) }}
        profile: ${{ fromJSON(needs.config.outputs.test-profiles) }}
    env:
      NXF_ANSI_LOG: false
      NFT_WORKDIR: ${{ needs.config.outputs.nf-test-workdir }}
      NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
      NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
    steps:
      - name: Clean workspace
        run: |
          rm -rf ./* ./.??* || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only the singularity profile reads these directories. Neither
      # actions/checkout nor the Clean workspace step above creates them.
      - name: Create Singularity cache directories
        if: matrix.profile == 'singularity'
        run: mkdir -p "$NXF_SINGULARITY_CACHEDIR" "$NXF_SINGULARITY_LIBRARYDIR"

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.nxf-version }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Setup nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ needs.config.outputs.nf-test-version }}
          install-pdiff: true

      # Only the singularity profile needs a container runtime installed.
      - name: Setup Apptainer
        if: matrix.profile == 'singularity'
        uses: eWaterCycle/setup-apptainer@3f706d898c9db585b1d741b4692e66755f3a1b40 # v2.0.0
        with:
          apptainer-version: 1.3.6

      # Only the conda profile needs conda installed.
      - name: Setup Miniconda
        if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: true
          channels: conda-forge,bioconda

      - name: Run nf-test
        id: run-nf-test
        uses: $/actions/nf-test
        # A regression only in Nextflow's floating 'latest' alias should not
        # block CI: report it without failing the run.
        continue-on-error: ${{ contains(matrix.nxf-version, 'latest') }}
        env:
          SENTIEON_AUTH_MECH: 'GitHub Actions - token'
          SENTIEON_LICSRVR_IP: ${{ secrets.SENTIEON_LICSRVR_IP }}
          SENTIEON_LICENSE_MESSAGE: ${{ secrets.SENTIEON_LICENSE_MESSAGE }}
          SENTIEON_ENCRYPTION_KEY: ${{ secrets.SENTIEON_ENCRYPTION_KEY }}
          # Empty on a fork PR: GitHub does not pass secrets to those runs, so
          # this also covers the case where the secrets above are unset.
          SKIP_SENTIEON: ${{ secrets.SENTIEON_LICSRVR_IP == '' }}
          # Only the 'gpu' variant runs on a runner with a GPU attached.
          SKIP_GPU: ${{ inputs.variant != 'gpu' }}
        with:
          profile: test,${{ matrix.profile }}
          shard: ${{ matrix.shard }}
          total-shards: ${{ needs.nf-test-changes.outputs.total-shards }}
          changed-since: ${{ needs.config.outputs.changed-since }}

      # A failure here only matters on a pull request (pr_number.txt would
      # be blank otherwise) and only for the floating 'latest' leg: every
      # other failure already fails this job directly, so 'confirm-pass'
      # already reports it without a comment. 'always()' so this still runs
      # when 'Run nf-test' itself failed outright, matching the same fix in
      # linting.yml and template-version-comment.yml. 'strategy.job-index' in
      # both the file name and the artifact name keeps every parallel leg
      # from colliding, including after 'confirm-pass' merges every
      # artifact's files into one directory.
      - name: Prepare PR comment fragment
        if:
          always() && github.event_name == 'pull_request' &&
          steps.run-nf-test.outcome == 'failure' && contains(matrix.nxf-version,
          'latest')
        env:
          PROFILE: ${{ matrix.profile }}
          NXF_VERSION: ${{ matrix.nxf-version }}
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ needs.nf-test-changes.outputs.total-shards }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          mkdir -p pr-comment-fragment
          echo "* \`$PROFILE\` | \`$NXF_VERSION\` | shard $SHARD/$TOTAL_SHARDS" > "pr-comment-fragment/${JOB_INDEX}.md"

      - name: Upload PR comment fragment
        if:
          always() && github.event_name == 'pull_request' &&
          steps.run-nf-test.outcome == 'failure' && contains(matrix.nxf-version,
          'latest')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nf-test-comment-fragment-${{ strategy.job-index }}
          retention-days: 1
          path: pr-comment-fragment/

  # Single, stable check name for branch protection: it reports the combined
  # result of every job above, and always runs so the check exists even when
  # one of them was skipped or failed.
  confirm-pass:
    name: confirm-pass
    needs: [config, nf-test-changes, nf-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a required job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1

      # Only a pull_request event has a pull request to comment on;
      # pr_number.txt would be blank otherwise (same gate as linting.yml and
      # template-version-comment.yml). 'always()' throughout so a failed or
      # cancelled matrix leg above still gets reported here, instead of this
      # step being skipped along with it.
      - name: Download PR comment fragments
        if: always() && github.event_name == 'pull_request'
        # No fragment artifact exists when no leg against Nextflow's
        # 'latest' version failed, which is the normal case. continue-on-error
        # keeps that normal case from failing this job.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nf-test-comment-fragment-*
          path: pr-comment-fragments
          merge-multiple: true

      - name: Build PR comment
        if: always() && github.event_name == 'pull_request'
        uses: $/actions/nf-test-comment
        with:
          fragments-path: pr-comment-fragments
          pr-number: ${{ github.event.pull_request.number }}
          run-url:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}

      - name: Upload PR comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment
          retention-days: 1
          path: pr-comment/
