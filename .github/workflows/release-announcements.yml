name: release-announcements

# Reusable workflow: announces a published release to the pipeline's
# configured channels. Each channel is optional: a pipeline that does not
# pass a channel's secret gets that channel skipped, with a clear log line,
# never a failure and never a silent no-op.
#
# Four jobs:
#   config       - reads '.nf-core.yml' for the pipeline's display name, and
#                  guards that this run actually carries a release payload.
#                  No secret, no pull request code.
#   mastodon     - posts to Mastodon when 'MASTODON_ACCESS_TOKEN' is set.
#   bluesky      - posts to Bluesky when 'BLUESKY_IDENTIFIER' and
#                  'BLUESKY_APP_PASSWORD' are both set.
#   confirm-pass - single, stable, always-run outcome; see nf-test.yml's own
#                  job of the same name for why.
#
# Composing the announcement, and posting it, both happen inside
# 'actions/announce-release'. Mastodon's and Bluesky's own REST APIs are a
# single authenticated POST each (Bluesky: log in, then post): simple enough
# for this repo's own reviewed code to call directly, with Node's built-in
# fetch, rather than through a third-party action. See README.md's "Where
# the network call lives, and why no third-party action" note.
on:
  workflow_call:
    inputs:
      mastodon-host:
        description: >-
          Mastodon instance host to post to, for example 'mstdn.science'.
        type: string
        required: false
        default: mstdn.science
      mastodon-max-length:
        description: >-
          Maximum length of the Mastodon post, in UTF-16 code units. Mastodon's
          own default server-side limit is 500, but a self-hosted instance can
          configure a different one; set this to match.
        type: string
        required: false
        default: '500'
    secrets:
      MASTODON_ACCESS_TOKEN:
        description: >-
          Mastodon access token, scoped to write:statuses. Optional: a pipeline
          that does not announce to Mastodon omits it, and the 'mastodon' job
          skips with a log line instead of failing.
        required: false
      BLUESKY_IDENTIFIER:
        description: >-
          Bluesky account handle or DID to post as. Optional, paired with
          'BLUESKY_APP_PASSWORD': a pipeline that does not announce to Bluesky
          omits both, and the 'bluesky' job skips with a log line.
        required: false
      BLUESKY_APP_PASSWORD:
        description: >-
          Bluesky app password (not the account's own login password: create one
          under Bluesky's Settings > App Passwords). Optional, paired with
          'BLUESKY_IDENTIFIER'.
        required: false

permissions:
  contents: read # 'config' checks out '.nf-core.yml'

jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checks out '.nf-core.yml' for read-config to read
    outputs:
      pipeline-name: ${{ steps.read-config.outputs.pipeline-name }}
    steps:
      # This workflow only makes sense for a 'release' event. A pipeline
      # stub that calls it from anything else (a stray 'workflow_dispatch',
      # for example) would otherwise compose an announcement out of an empty
      # payload. Failing here, once, is clearer than each channel job
      # separately discovering an empty tag.
      - name: Require a release event
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "::error::This workflow requires a 'release' event (types: [published]). github.event.release.tag_name is empty, so the triggering event carried no release payload. See README.md." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config

  mastodon:
    name: mastodon
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Runs unconditionally, so a missing secret is always a visible,
      # explained skip, not silence: the alternative, a job-level 'if:',
      # would report as "skipped" in the checks list with no line of log
      # explaining why.
      - name: Check for the Mastodon access token
        id: check
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          if [ -z "$MASTODON_ACCESS_TOKEN" ]; then
            echo "::notice::MASTODON_ACCESS_TOKEN is not set. Skipping the Mastodon announcement. Pass it from the calling workflow's own 'secrets:' block to enable it. See README.md."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose and post to Mastodon
        if: steps.check.outputs.skipped != 'true'
        uses: $/actions/announce-release
        with:
          channel: mastodon
          tag-name: ${{ github.event.release.tag_name }}
          release-name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          html-url: ${{ github.event.release.html_url }}
          prerelease: ${{ github.event.release.prerelease }}
          pipeline-name: ${{ needs.config.outputs.pipeline-name }}
          repository: ${{ github.repository }}
          # Configurable, not a protocol constant: a self-hosted Mastodon
          # instance can set a lower toot length than the 500 this
          # workflow's own 'mastodon-max-length' input defaults to.
          max-length: ${{ inputs.mastodon-max-length }}
          mastodon-host: ${{ inputs.mastodon-host }}
          mastodon-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}

  bluesky:
    name: bluesky
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Same reasoning as the Mastodon job's own check step above.
      - name: Check for the Bluesky credentials
        id: check
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -z "$BLUESKY_IDENTIFIER" ] || [ -z "$BLUESKY_APP_PASSWORD" ]; then
            echo "::notice::BLUESKY_IDENTIFIER and/or BLUESKY_APP_PASSWORD is not set. Skipping the Bluesky announcement. Pass both from the calling workflow's own 'secrets:' block to enable it. See README.md."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose and post to Bluesky
        if: steps.check.outputs.skipped != 'true'
        uses: $/actions/announce-release
        with:
          channel: bluesky
          tag-name: ${{ github.event.release.tag_name }}
          release-name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          html-url: ${{ github.event.release.html_url }}
          prerelease: ${{ github.event.release.prerelease }}
          pipeline-name: ${{ needs.config.outputs.pipeline-name }}
          repository: ${{ github.repository }}
          # Bluesky's own AT Protocol post-length limit, a fixed part of
          # the protocol every client observes, not a setting.
          max-length: '300'
          bluesky-identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          bluesky-password: ${{ secrets.BLUESKY_APP_PASSWORD }}

  # Single, stable check name: see nf-test.yml's own 'confirm-pass' job for
  # why this always runs.
  confirm-pass:
    name: confirm-pass
    needs: [config, mastodon, bluesky]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a required job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
