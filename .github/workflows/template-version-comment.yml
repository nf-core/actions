name: template-version-comment

# Reusable workflow: reports whether the pipeline is behind the latest
# nf-core/tools template release, as a pull request comment. Replaces a
# vendored workflow that used to combine this check with posting the
# comment in one job — a design that was a private security advisory once
# it ran as 'pull_request_target' with a bot token in the same job, reading
# a template version the pull request itself controlled. The fix already
# shipped in the vendored version this replaces: split the check from the
# posting.
#
# This workflow is only the unprivileged half. It runs on 'pull_request',
# holds 'contents: read' and no secret, and only ever writes a 'pr-comment'
# artifact. It never posts a comment and never holds a credential that
# could. Stage 7's 'pr-comment.yml' posts the artifact separately, once the
# pipeline's own stub adds this workflow's name to its 'workflows:' watch
# list; see README.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  template-version:
    name: template-version
    # Defensive: this workflow only makes sense for a pull_request event
    # (it needs github.event.pull_request.number). The pipeline stub only
    # ever triggers 'on: pull_request', but this keeps a future stub that
    # widens its own triggers from crashing here instead of skipping cleanly.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config

      - name: Compare template version
        uses: $/actions/template-version
        with:
          nf-core-version: ${{ steps.read-config.outputs.nf-core-version }}
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}

      # if: always() so this still runs (and, when the step above wrote
      # nothing, uploads nothing) if 'Compare template version' fails
      # outright, matching the same fix in branch.yml and linting.yml.
      - name: Upload PR comment artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment
          retention-days: 1
          path: pr-comment/
