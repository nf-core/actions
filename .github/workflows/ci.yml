name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:coverage

      - name: Build action bundles
        run: npm run package

      # dist/ is committed, see CONTRIBUTING.md. git status also catches an
      # untracked dist/ (a new action whose bundle was never committed).
      - name: Check that committed bundles are up to date
        run: |
          status="$(git status --porcelain -- 'actions/*/dist/**')"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::actions/*/dist is out of date. Run 'npm run package' and commit the result."
            exit 1
          fi
