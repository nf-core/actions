name: fix-linting

# Reusable workflow: a pipeline calls this from an 'issue_comment' stub (see
# README.md) to fix its own lint failures on '@nf-core-bot fix linting'.
#
# Three jobs, each holding only what its own step needs, and each bounded by
# its own timeout-minutes:
#   acknowledge  - gates the whole run on who commented and on whether the
#                  pull request's head branch is protected, reacts so the
#                  commenter knows it started. Holds only the ephemeral
#                  per-job token, read-only, and never checks out the pull
#                  request.
#   prepare-fix  - checks out the pull request and runs its own lint hooks.
#                  Untrusted code. No secrets, read-only, no persisted
#                  credential.
#   push-fix     - re-checks the pull request head, validates the patch
#                  'prepare-fix' produced, then applies, commits, and pushes
#                  it with the bot's own token. Never runs pull request code.
#
# See SECURITY.md for the trust boundary this design follows.
on:
  workflow_call:
    secrets:
      BOT_TOKEN:
        description: >-
          Push credential for the bot account, used only in 'push-fix' to commit
          and push the validated patch. Optional so a pipeline that omits it
          gets a clear failure instead of a silent push with the default token.
        required: false

permissions: {}

jobs:
  acknowledge:
    name: acknowledge
    # issue_comment fires for both issues and pull requests; 'pull_request'
    # is only present on the payload's 'issue' object when it is one.
    if: >-
      github.event.issue.pull_request && contains(github.event.comment.body,
      '@nf-core-bot fix linting')
    runs-on: ubuntu-latest
    # Tightest bound that still leaves room for GitHub's API: this job makes
    # a handful of quick calls and reacts to the comment, nothing else.
    timeout-minutes: 5
    # 'contents: read' is required for the branch and pull-request lookups
    # below, and, in practice, for the collaborator-permission lookup too:
    # GitHub's own docs list that endpoint's requirement as the "Metadata"
    # permission, which every token already holds, but an 'issues: write'
    # -only token still gets a 403 calling it. 'contents: read' is the
    # permission that has been observed to fix that in GitHub Actions.
    permissions:
      contents: read
      issues: write
    steps:
      # The bot pushes to the pull request head branch with an
      # organisation-wide token. A branch that is not protected only needs
      # write access to push to directly, so letting its author or any
      # write/admin collaborator trigger the bot grants them nothing beyond
      # what they could already do themselves. A protected branch (for
      # example a release pull request's head) blocks even its own author
      # from pushing directly, so the bot must not become a way around that:
      # only admin is trusted there, and the author gets no exemption.
      - name: Require write access, or admin when the head branch is protected
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Every API call below is checked explicitly instead of relying on
          # the shell's own -e: a failed call must deny the request with a
          # clear reason, not abort silently before printing anything.
          if ! pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>&1)"; then
            echo "::error::Could not read pull request #${PR_NUMBER}. The permission check could not be completed, so the request is denied. gh said: ${pr_json}"
            exit 1
          fi
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          if [ -z "$head_repo" ]; then
            echo "::error::The pull request's head repository is gone (for example a deleted fork). The permission check could not be completed, so the request is denied."
            exit 1
          fi

          if ! branch_json="$(gh api "repos/${head_repo}/branches/${head_ref}" 2>&1)"; then
            echo "::error::Could not read branch protection for '${head_repo}:${head_ref}'. The permission check could not be completed, so the request is denied. gh said: ${branch_json}"
            exit 1
          fi
          protected="$(jq -r '.protected' <<<"$branch_json")"

          if [ "$protected" != "true" ] && [ "$COMMENTER" = "$PR_AUTHOR" ]; then
            echo "Commenter is the pull request author, and the head branch is not protected."
            exit 0
          fi

          if ! permission_json="$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" 2>&1)"; then
            echo "::error::Could not determine ${COMMENTER}'s permission on ${REPO}. The permission check could not be completed, so the request is denied. gh said: ${permission_json}"
            exit 1
          fi
          permission="$(jq -r .permission <<<"$permission_json")"
          echo "Commenter '${COMMENTER}' has repository permission: ${permission}. Head branch protected: ${protected}."

          if [ "$protected" = "true" ]; then
            if [ "$permission" = "admin" ]; then
              exit 0
            fi
            echo "::error::${COMMENTER} does not have admin access to ${REPO}. The pull request's head branch '${head_ref}' is protected, so pushing a lint fix to it needs admin, even for the pull request's own author. Ask an admin to run the fix, or push the fix yourself."
            exit 1
          fi

          case "$permission" in
            admin|write)
              exit 0
              ;;
            *)
              echo "::error::${COMMENTER} is not the pull request author and does not have write access to ${REPO}."
              exit 1
              ;;
          esac

      - name: React to the comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run:
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions"
          -f content='eyes'

  prepare-fix:
    name: prepare-fix
    needs: acknowledge
    runs-on: ubuntu-latest
    # Tightest bound of the jobs that do real work: this is the one job that
    # runs hooks the pull request controls, and a hook that hangs or
    # downloads forever would otherwise run until GitHub's own six-hour
    # maximum. 10 minutes is still generous for prek's own cold-start hook
    # setup on a real pipeline.
    timeout-minutes: 10
    # No secret is referenced anywhere below, and this token is read-only:
    # a pre-commit hook the pull request defines runs in this job, and must
    # not be able to write anything or read a credential.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.pr.outputs.head_sha }}
      has-patch: ${{ steps.patch.outputs.has_patch }}
      prek-outcome: ${{ steps.prek.outcome }}
    steps:
      # Reads .nf-core.yml from the default branch, before the checkout
      # below switches this workspace to the pull request's own content: the
      # nextflow version used to run the pull request's lint hooks must come
      # from a version this repository's maintainers wrote, not from the
      # pull request under test.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config

      - name: Checkout pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version:
            ${{ fromJSON(steps.read-config.outputs.nextflow-versions)[0] }}

      # prek manages each hook's own environment; nothing here installs a
      # pipeline dependency beyond what its own .pre-commit-config.yaml asks
      # prek to set up. continue-on-error: true because a lint failure here
      # is the expected reason this workflow runs, not a broken job.
      - name: Run prek
        id: prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        continue-on-error: true

      - name: Create lint fix patch
        id: patch
        if: steps.prek.outcome == 'failure'
        env:
          PATCH_FILE: ${{ runner.temp }}/lint-fix.patch
        run: |
          git add --all
          git diff --cached --binary --full-index --no-ext-diff > "$PATCH_FILE"
          if [ ! -s "$PATCH_FILE" ]; then
            echo "prek failed without producing a fix."
            exit 1
          fi
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Upload lint fix patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-fix
          path: ${{ runner.temp }}/lint-fix.patch
          if-no-files-found: error
          retention-days: 1

  push-fix:
    name: push-fix
    needs: prepare-fix
    # Runs even when prepare-fix failed outright, so it can still report
    # that failure. Skips only when prepare-fix itself never ran (the
    # acknowledge gate above rejected the comment).
    if: ${{ always() && needs.prepare-fix.result != 'skipped' }}
    runs-on: ubuntu-latest
    # Looser than 'prepare-fix': this job runs no pull request code, only
    # its own checkout, patch download, apply, commit, and push.
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout
        if: needs.prepare-fix.outputs.has-patch == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact pull request head
        if: needs.prepare-fix.outputs.has-patch == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ needs.prepare-fix.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::The pull request head changed after prek ran. The patch no longer describes the current tree."
            exit 1
          fi

      - name: Download lint fix patch
        if: needs.prepare-fix.outputs.has-patch == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lint-fix
          path: ${{ runner.temp }}/lint-fix

      # The last gate before this job applies untrusted diff content: rejects
      # a symlink, an empty or oversized file, a malformed patch, and a patch
      # that no longer applies. See actions/validate-patch/action.yml.
      - name: Validate the patch
        if: needs.prepare-fix.outputs.has-patch == 'true'
        uses: $/actions/validate-patch
        with:
          patch-path: ${{ runner.temp }}/lint-fix/lint-fix.patch

      - name: Apply the patch
        if: needs.prepare-fix.outputs.has-patch == 'true'
        env:
          PATCH_FILE: ${{ runner.temp }}/lint-fix/lint-fix.patch
        run: git apply --index "$PATCH_FILE"

      - name: Commit and push changes
        id: commit-and-push
        if: needs.prepare-fix.outputs.has-patch == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The BOT_TOKEN secret is not set. Refusing to push with the default token; pass BOT_TOKEN from the calling workflow. See README.md."
            exit 1
          fi

          gh auth setup-git
          git config user.email "core@nf-co.re"
          git config user.name "nf-core-bot"
          git config push.default upstream
          git status
          # A repository-supplied hook or GPG configuration must not run
          # inside this credentialed job.
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit \
            --no-verify -m "[automated] Fix code linting"
          git -c core.hooksPath=/dev/null push --no-verify

      - name: React if there was nothing to fix
        if: needs.prepare-fix.outputs.prek-outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run:
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions"
          -f content='+1'

      - name: React if linting errors were fixed
        if: steps.commit-and-push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run:
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions"
          -f content='hooray'

      - name: React and comment if linting was not fixed
        if:
          ${{ always() && (failure() || needs.prepare-fix.result != 'success')
          }}
        env:
          ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='confused'
          gh pr comment "$PR_NUMBER" --body "@${ACTOR} I tried to fix the linting errors, but it didn't work. Please fix them manually.
          See [CI log](${RUN_URL}) for more details."
