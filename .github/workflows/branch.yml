name: branch

# Reusable workflow: enforces that a pull request into this pipeline's
# release branch (main/master) comes only from the pipeline's own 'dev'
# branch, or its own 'patch' branch for a hotfix. Replaces a vendored
# workflow that checked the same rule with a shell one-liner and built its
# own 'pr-comment' artifact by hand; this rewrites the check itself in
# TypeScript (see actions/branch, which also closes a gap the shell version
# left open: a branch merely named 'patch' in an unrelated fork used to
# pass too).
#
# This job needs no write permission and never checks out anything: the
# decision only ever reads the triggering pull request's own event data. It
# writes the 'pr-comment' artifact, with a comment ('branch') only when the
# check fails; a separate, privileged 'pr-comment.yml' posts it, from a job
# that never runs pull request code. There is no resolved note: a pull
# request's head repository, head branch, and this pipeline's canonical
# repository never change, so a blocked decision can never later flip to
# allowed. See README.md.
on:
  workflow_call:

permissions: {}

jobs:
  branch:
    name: branch
    # No 'if: github.event_name == ...' guard here: this is a required
    # status check, and GitHub counts a skipped required check as passed.
    # A stub whose trigger drifted past 'pull_request' must fail loudly
    # instead of silently dropping branch protection, so the action itself
    # (see 'event-name' below) checks the event and fails when it is wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the pull request's source branch
        uses: $/actions/branch
        with:
          event-name: ${{ github.event_name }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          head-ref: ${{ github.event.pull_request.head.ref }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.repository }}
          pr-user: ${{ github.event.pull_request.user.login }}
          pr-number: ${{ github.event.pull_request.number }}

      # if: always() so the artifact still uploads when the step above
      # fails (an intentional check failure, not a crash): that failure is
      # exactly the case with a comment to post.
      - name: Upload PR comment artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment
          path: pr-comment/
