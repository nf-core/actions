name: download-pipeline

# Reusable workflow: tests 'nf-core pipelines download' against this
# pipeline, then runs the downloaded copy (stub run first) and checks that
# every container image it needs was already cached by the download step.
# Replaces a vendored workflow that ran the same steps by hand and diffed
# container counts in shell; the comparison now lives in
# actions/verify-offline-run, in TypeScript, with its own tests. See
# README.md for the pipeline stub.
#
# The 'download' job runs pipeline code (the downloaded pipeline itself, and
# whatever 'nf-core pipelines download' resolves from it), so it gets no
# secrets and no push credential. It does not check out the calling
# pipeline: read-config runs in the separate 'config' job, 'nf-core
# pipelines download' fetches the pipeline from GitHub itself, and the
# sibling action below is resolved by the runner, not from a checkout. A
# checkout in this job would also be actively harmful, not just unused: a
# 'run:' step executes in the checked-out workspace, and Nextflow gives
# launch-directory config precedence over a project's own, so the pull
# request's own 'nextflow.config' would have taken over both 'nextflow run'
# invocations below.
on:
  workflow_call:
    inputs:
      revision:
        description: >-
          Pipeline revision (branch, tag, or commit) to download and test.
        type: string
        required: false
        default: 'dev'
      runner:
        description: >-
          RunsOn runner label override for this call, for example
          '4cpu-linux-x64'. Forwarded to read-config's own 'runner' input, so it
          wins over '.nf-core.yml' the same way any read-config input does.
          Leave unset to use the repository's configured runner.
        type: string
        required: false
        default: ''

permissions:
  contents: read # 'config' checks out the pipeline to read .nf-core.yml; 'download' checks out nothing

jobs:
  # Resolves CI settings once, on a plain GitHub-hosted runner: it only reads
  # a file from the checkout, so it does not need the runner pool the
  # download job below uses. See nf-test.yml's own 'config' job for the same
  # split.
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checks out .nf-core.yml for read-config to read
    outputs:
      nf-core-version: ${{ steps.read-config.outputs.nf-core-version }}
      pipeline-name: ${{ steps.read-config.outputs.pipeline-name }}
      runner: ${{ steps.read-config.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config
        with:
          runner: ${{ inputs.runner }}

  download:
    name: download
    needs: config
    runs-on:
      - runs-on=${{ github.run_id }}-download
      - runner=${{ needs.config.outputs.runner }}
      # Singularity images for a large pipeline add up; matches nf-test.yml's
      # own heavy job, which caches the same kind of image.
      - volume=80gb
    # Downloads every container image the pipeline needs, then runs it twice
    # (stub, and a full fallback run when the stub profile is unsupported).
    # A large pipeline's image set alone can take the better part of an
    # hour on a cold cache; this bounds it well short of the 6 hour default
    # without being tight enough to flake on a slow registry.
    timeout-minutes: 45
    permissions: {} # checks out nothing; downloads and runs the pipeline directly
    defaults:
      run:
        # Explicit, not the runner's default: naming 'bash' here also turns
        # on 'pipefail', so the snapshot steps below fail if 'find' does,
        # instead of only reflecting the following 'sort''s exit status.
        shell: bash
    env:
      NXF_ANSI_LOG: false
      NF_CORE_VERSION: ${{ needs.config.outputs.nf-core-version }}
      OUTDIR: ${{ needs.config.outputs.pipeline-name }}
      REVISION: ${{ inputs.revision }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@4bb22c52d4f63406c49e94c804632975787312b3 # v2.0.0
        with:
          apptainer-version: 1.3.6

      # Same guard, same wording, as linting.yml's: NF_CORE_VERSION comes
      # from 'nf_core_version' in .nf-core.yml, and two values reach the
      # install step below with no matching PyPI release: empty (the key is
      # missing, so pip gets 'nf-core==' and a parse error far from this
      # comment) and a development suffix such as '3.4.2dev' (nf-core/tools'
      # own in-progress version, never itself released).
      - name: Guard the nf-core version before install
        run: |
          if [ -z "$NF_CORE_VERSION" ]; then
            echo "::error::'nf_core_version' is not set in .nf-core.yml (read by read-config as nf-core-version). Set it to a released nf-core/tools version, for example '4.0.3'." >&2
            exit 1
          fi
          case "$NF_CORE_VERSION" in
            *dev)
              echo "::error::'nf_core_version' in .nf-core.yml is '$NF_CORE_VERSION', a development version with no matching release on PyPI. Set it to a released nf-core/tools version, without the 'dev' suffix." >&2
              exit 1
              ;;
          esac

      - name: Install nf-core
        run: |
          python -m pip install --upgrade pip
          pip install "nf-core==$NF_CORE_VERSION"

      - name: Make a cache directory for the container images
        run: mkdir -p ./singularity_container_images

      # OUTDIR comes from 'template.name' in .nf-core.yml, read by
      # read-config as pipeline-name; read-config documents it as empty
      # when that key is absent, true for older pipelines. An empty OUTDIR
      # would make the download and both 'find' commands below target the
      # workspace root instead of failing.
      - name: Guard the pipeline name before it names the output directory
        run: |
          if [ -z "$OUTDIR" ]; then
            echo "::error::'template.name' is not set in .nf-core.yml (read by read-config as pipeline-name). Set it to the pipeline's name, for example 'rnaseq'." >&2
            exit 1
          fi

      # REVISION and REPOSITORY come from this call's own 'revision' input
      # and from 'github.repository': read from env, never interpolated into
      # the command line, so neither can inject a shell argument.
      - name: Download the pipeline
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
        run: |
          nf-core pipelines download "$REPOSITORY" \
            --revision "$REVISION" \
            --outdir "$OUTDIR" \
            --compress none \
            --container-system singularity \
            --container-library quay.io -l docker.io -l community.wave.seqera.io/library/ \
            --container-cache-utilisation amend \
            --download-configuration yes

      # 'nf-core pipelines download' names the revision directory after a
      # sanitised form of REVISION, alongside a 'configs' directory it also
      # creates; finding the one directory that is not 'configs' avoids
      # reimplementing that sanitisation here. Resolved once, into
      # $GITHUB_ENV, so both run steps below use the same value instead of
      # each recomputing it, and so a second top-level directory fails
      # clearly here instead of turning into a multi-line path that breaks
      # 'nextflow run' with a confusing error.
      - name: Resolve the downloaded pipeline directory
        run: |
          dirs=$(find "$OUTDIR" -mindepth 1 -maxdepth 1 -type d -not -name configs)
          if [ -n "$dirs" ]; then
            count=$(printf '%s\n' "$dirs" | wc -l)
          else
            count=0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one pipeline directory under '$OUTDIR' (excluding 'configs'), found $count: $(printf '%s' "$dirs")" >&2
            exit 1
          fi
          echo "PIPELINE_DIR=$dirs" >> "$GITHUB_ENV"

      - name: Snapshot the container cache before running the pipeline
        run:
          find ./singularity_container_images -mindepth 1 -maxdepth 1 -printf
          '%f\n' | sort > "$RUNNER_TEMP/containers-before.txt"

      - name: Run the downloaded pipeline (stub)
        id: stub-run
        continue-on-error: true
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          NXF_SINGULARITY_HOME_MOUNT: true
        run:
          nextflow run "$PIPELINE_DIR" -stub -profile test,singularity --outdir
          ./results

      - name: Run the downloaded pipeline (stub not supported)
        if: steps.stub-run.outcome == 'failure'
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          NXF_SINGULARITY_HOME_MOUNT: true
        run:
          nextflow run "$PIPELINE_DIR" -profile test,singularity --outdir
          ./results

      - name: Snapshot the container cache after running the pipeline
        run:
          find ./singularity_container_images -mindepth 1 -maxdepth 1 -printf
          '%f\n' | sort > "$RUNNER_TEMP/containers-after.txt"

      - name: Verify the run stayed offline
        uses: $/actions/verify-offline-run
        with:
          before-path: ${{ runner.temp }}/containers-before.txt
          after-path: ${{ runner.temp }}/containers-after.txt

      # if: always() so this still uploads when a step above failed
      # (an intentional check failure, not a crash): that is exactly the
      # run whose log is worth reading.
      - name: Upload Nextflow log for debugging
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextflow-log
          retention-days: 7
          path: .nextflow.log*
          include-hidden-files: true

  # Single, stable check name for branch protection: see nf-test.yml's own
  # 'confirm-pass' job for why this always runs.
  confirm-pass:
    name: confirm-pass
    needs: [config, download]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a required job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
