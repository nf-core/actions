name: awsfulltest

# Reusable workflow: launches the pipeline's full-scale test on Seqera
# Platform. This spends real cloud budget on organisation-level credentials,
# so launching from a pull request is gated on trusted approval, not left to
# 'pull_request_review: [submitted]' alone.
#
# Four jobs:
#   config       - reads '.nf-core.yml'. No secret, no pull request code.
#   authorize    - decides whether to launch, from the GitHub API and the
#                  triggering event alone (see actions/authorize-launch).
#                  Checks out nothing, runs no pull request code.
#   run-platform - launches the test, only when 'authorize' says so, against
#                  the revision 'authorize' resolved. Never the revision of
#                  the pull request under review: see README.md's "Trusted
#                  revision" note.
#   confirm-pass - single, stable, always-run outcome; see nf-test.yml's own
#                  job of the same name for why.
#
# A 'concurrency' group below, keyed on the pull request, queues a second
# run for the same pull request behind a first one still in progress: see
# README.md's "One launch per crossing" note for why that closes the race
# this stage's review found, and why nothing here also records which review
# already triggered a launch.
on:
  workflow_call:
    inputs:
      parameters:
        description: >-
          Extra Nextflow parameters for the full test, as a JSON object string,
          for example '{"aligner":"star_salmon"}'. Genuinely pipeline-specific
          (see README.md), so it comes from the calling stub, not from
          '.nf-core.yml'. Merged with the 'outdir' this workflow computes; a
          top-level 'outdir' key here is overridden. Read from the stub
          committed on the repository's default branch, never from pull request
          content. Defaults to '{}' (no extra parameters).
        type: string
        required: false
        default: '{}'
      nextflow-config:
        description: >-
          Extra Nextflow config for the full test, for example a completion
          notification block that names no secret. Passed to the launch action's
          own 'nextflow_config' input, with the Slack notification block (built
          from 'slack-channel' and the 'SLACK_BOT_TOKEN' secret below) appended.
          Read from the calling stub, the same as 'parameters' above. Defaults
          to '' (none).
        type: string
        required: false
        default: ''
      slack-channel:
        description: >-
          Slack channel to notify on completion, for example '#pipeline-ci'.
          Combined with the 'SLACK_BOT_TOKEN' secret, inside this workflow, to
          build the notification block: see README.md's "Do not route a secret
          through a string input" note for why the token itself is a secret, not
          a 'with:' input. Leave both unset to skip notification.
        type: string
        required: false
        default: ''
    secrets:
      TOWER_ACCESS_TOKEN:
        description: >-
          Seqera Platform access token. Optional on 'workflow_call' so a
          pipeline that omits it gets a clear failure instead of a launch
          attempt with no account behind it.
        required: false
      SLACK_BOT_TOKEN:
        description: >-
          Slack bot token for the completion notification. Optional: omit both
          this and 'slack-channel' to skip notification. Never passed as a
          'with:' input, so it is masked in the log and never leaves this
          workflow as plain text.
        required: false

permissions:
  contents: read # 'config' checks out '.nf-core.yml'

concurrency:
  group:
    awsfulltest-${{ github.repository }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: false

jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checks out '.nf-core.yml' for read-config to read
    outputs:
      pipeline-name: ${{ steps.read-config.outputs.pipeline-name }}
      required-approvals:
        ${{ steps.read-config.outputs.awsfulltest-required-approvals }}
    steps:
      # 'required-approvals' gates whether a launch happens at all, so it
      # must come from a ref the pull request under review cannot change.
      # actions/checkout's default ref for a 'pull_request_review' run is
      # the pull request's own merge commit; reading '.nf-core.yml' from
      # that would let the diff under review lower its own approval bar and
      # then be approved once, reproducing the gap this stage closes. The
      # pull request's base commit is not: it is a commit on the release
      # branch, chosen by whoever pushed it there, never by this pull
      # request's own diff. 'workflow_dispatch' and 'release' have no
      # 'pull_request' context at all, so the expression is empty and
      # checkout falls back to its own default (the ref the event already
      # runs on, already maintainer-controlled either way).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref:
            ${{ github.event_name == 'pull_request_review' &&
            github.event.pull_request.base.sha || '' }}

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config

  authorize:
    name: authorize
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 'contents: read' is required for the collaborator-permission lookup
    # below in practice, the same nuance fix-linting.yml's own 'acknowledge'
    # job documents: GitHub's docs list that endpoint's requirement as the
    # 'Metadata' permission, which every token already holds, but a token
    # scoped to only 'pull-requests: read' still gets a 403 calling it.
    permissions:
      contents: read
      pull-requests: read # lists the pull request's reviews
      issues: read # lists the pull request's timeline, for a base-branch retarget
    outputs:
      should-run: ${{ steps.authorize.outputs.should-run }}
      revision: ${{ steps.authorize.outputs.revision }}
    steps:
      - name: Decide whether to launch
        id: authorize
        uses: $/actions/authorize-launch
        with:
          event-name: ${{ github.event_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          required-approvals: ${{ needs.config.outputs.required-approvals }}
          review-state: ${{ github.event.review.state }}
          review-user: ${{ github.event.review.user.login }}
          review-id: ${{ github.event.review.id }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-author: ${{ github.event.pull_request.user.login }}
          base-ref: ${{ github.event.pull_request.base.ref }}

  run-platform:
    name: run-platform
    needs: [config, authorize]
    if: needs.authorize.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require the Seqera Platform access token
        env:
          TOWER_ACCESS_TOKEN: ${{ secrets.TOWER_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOWER_ACCESS_TOKEN" ]; then
            echo "::error::The TOWER_ACCESS_TOKEN secret is not set. Pass it from the calling workflow's own 'secrets:' block. See README.md."
            exit 1
          fi

      # 'template.name' in .nf-core.yml, read by read-config as
      # 'pipeline-name', is documented as an empty string when absent (true
      # for older pipelines). An empty pipeline name would make every S3
      # path below collapse to the bucket root, and different pipelines'
      # runs would collide instead of failing. Same guard, same wording, as
      # download-pipeline.yml's.
      - name: Guard the pipeline name before it names the S3 path
        env:
          PIPELINE_NAME: ${{ needs.config.outputs.pipeline-name }}
        run: |
          if [ -z "$PIPELINE_NAME" ]; then
            echo "::error::'template.name' is not set in .nf-core.yml (read by read-config as pipeline-name). Set it to the pipeline's name, for example 'rnaseq'." >&2
            exit 1
          fi

      # Builds the final 'parameters' JSON once, outside the launch action's
      # own input: the stub's 'parameters' input is pipeline-specific and
      # must not have to already know the 'outdir' this workflow computes.
      - name: Merge outdir into the pipeline's own parameters
        id: params
        env:
          EXTRA_PARAMETERS: ${{ inputs.parameters }}
          OUTDIR:
            s3://${{ vars.AWS_S3_BUCKET }}/${{
            needs.config.outputs.pipeline-name }}/results-${{
            needs.authorize.outputs.revision }}
        run: |
          merged="$(jq -c --arg outdir "$OUTDIR" '. + {outdir: $outdir}' <<<"$EXTRA_PARAMETERS")"
          echo "parameters=$merged" >> "$GITHUB_OUTPUT"

      # The Slack bot token never crosses as a 'with:' input: it is declared
      # as a named 'workflow_call' secret above, read here only through
      # 'env:', and the block built from it is written to '$GITHUB_OUTPUT',
      # never echoed. This keeps it masked in the log and out of any
      # artifact this job uploads. See README.md's "Do not route a secret
      # through a string input" note.
      - name: Build the Slack notification config block
        id: notify
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack-channel }}
          EXTRA_CONFIG: ${{ inputs.nextflow-config }}
        run: |
          config="$EXTRA_CONFIG"
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
            config="$config
          env {
              SLACK_BOT_TOKEN = '$SLACK_BOT_TOKEN'
              SLACK_CHANNEL = '$SLACK_CHANNEL'
          }"
          fi
          {
            echo "nextflow-config<<NFCONFIG_EOF"
            echo "$config"
            echo "NFCONFIG_EOF"
          } >> "$GITHUB_OUTPUT"

      # 'workspace_id', 'compute_env' and 'AWS_S3_BUCKET' are repository or
      # organisation variables (the 'vars' context), not secrets: GitHub
      # makes 'vars' available to a called reusable workflow automatically,
      # the same as 'github', so this workflow does not need to declare or
      # forward them.
      - name: Launch workflow via Seqera Platform
        uses: seqeralabs/action-tower-launch@v2
        with:
          workspace_id: ${{ vars.TOWER_WORKSPACE_ID }}
          access_token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute_env: ${{ vars.TOWER_COMPUTE_ENV }}
          revision: ${{ needs.authorize.outputs.revision }}
          workdir:
            s3://${{ vars.AWS_S3_BUCKET }}/work/${{
            needs.config.outputs.pipeline-name }}/work-${{
            needs.authorize.outputs.revision }}
          nextflow_config: ${{ steps.notify.outputs.nextflow-config }}
          parameters: ${{ steps.params.outputs.parameters }}
          profiles: test_full

      # if: always() so this still uploads when the launch step above
      # failed: that is exactly the run whose debug log is worth reading.
      - name: Upload Seqera Platform debug log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Seqera Platform debug log file
          path: |
            tower_action_*.log
            tower_action_*.json

  # Single, stable check name: see nf-test.yml's own 'confirm-pass' job for
  # why this always runs. 'run-platform' is legitimately skipped whenever
  # 'authorize' says not to launch, which must not read as a failure here.
  confirm-pass:
    name: confirm-pass
    needs: [config, authorize, run-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a required job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
