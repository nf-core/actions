name: clean-up

# Reusable workflow: labels, and for issues only closes, an item an
# nf-core contributor tagged 'awaiting-changes' or 'awaiting-feedback' and
# nobody followed up on. Replaces a vendored workflow that ran
# 'actions/stale' directly, with the same settings: no pipeline has ever
# needed different day counts, labels or messages (see README.md), so none
# of them are configurable here.
#
# The scheduled trigger lives in the pipeline's own stub, not here (see
# README.md): 'workflow_call' has no 'schedule' event of its own.
#
# One job, privileged ('issues: write', 'pull-requests: write' to label,
# comment and close). It runs no pull request or issue content as code, so
# there is no untrusted-code boundary to enforce here; 'actions/stale' is
# GitHub's own action, the same publisher as 'actions/checkout' and
# 'actions/upload-artifact', both of which this repo already runs in a
# privileged job elsewhere (see fix-linting.yml). That is the trust tier
# this repo's 'no third-party action in a privileged job' rule (see
# CONTRIBUTING.md) means: this satisfies it, rather than needing an
# exception from it.
on:
  workflow_call:

permissions: {}

jobs:
  clean-up:
    name: clean-up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Labels and comments on a stale issue, and closes one once its grace
      # period runs out.
      issues: write
      # Labels and comments on a stale pull request. 'days-before-pr-close:
      # -1' below means this workflow never closes one itself.
      pull-requests: write
    steps:
      # A scheduled workflow runs in whichever repository holds the copy of
      # it that declares 'on: schedule' - here, the pipeline's own stub. A
      # fork that keeps the stub inherits the schedule, and would otherwise
      # label and close the fork's own issues and pull requests on the same
      # cadence as the pipeline it was forked from. The intent is exactly
      # that: skip a fork; 'repository.fork' says so directly, unlike
      # 'repository_owner', which happened to hold for every existing
      # nf-core pipeline but did not exempt a fork living under the
      # nf-core organisation itself, nor say anything about a pipeline
      # template used outside it.
      - name: Skip on a fork
        if: github.event.repository.fork
        run: >-
          echo "::notice::Skipping clean-up: ${{ github.repository }} is a
          fork."
      - name: Label and close stale issues and pull requests
        if: '!github.event.repository.fork'
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: >-
            This issue has been tagged as awaiting-changes or awaiting-feedback
            by an nf-core contributor. Remove the stale label or add a comment,
            otherwise this issue will be closed in 20 days.
          stale-pr-message: >-
            This PR has been tagged as awaiting-changes or awaiting-feedback by
            an nf-core contributor. Remove the stale label or add a comment if
            it is still useful.
          close-issue-message: >-
            This issue was closed because it was tagged as awaiting-changes or
            awaiting-feedback by an nf-core contributor and then stayed stale
            for 20 days with no activity.
          days-before-stale: 30
          days-before-close: 20
          days-before-pr-close: -1
          any-of-labels: awaiting-changes,awaiting-feedback
          exempt-issue-labels: WIP
          exempt-pr-labels: WIP
          repo-token: ${{ github.token }}
