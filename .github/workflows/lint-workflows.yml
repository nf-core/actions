name: Lint Workflows

# This repo governs every pipeline's CI. Its own workflow YAML gets scanned
# on every change.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    env:
      ACTIONLINT_VERSION: '1.7.12'
      # actionlint runs shellcheck over every 'run:' block when shellcheck is
      # on PATH, so shellcheck's version decides what this job reports. Pinning
      # actionlint alone is not enough: the runner image supplies shellcheck,
      # and a different version there means this job cannot be reproduced
      # locally. A pinned pair can.
      SHELLCHECK_VERSION: 'v0.11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache shellcheck binary
        id: cache-shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shellcheck-bin
          key: shellcheck-${{ env.SHELLCHECK_VERSION }}-${{ runner.os }}

      - name: Install shellcheck
        if: steps.cache-shellcheck.outputs.cache-hit != 'true'
        run: |
          mkdir -p shellcheck-bin
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C shellcheck-bin \
              "shellcheck-${SHELLCHECK_VERSION}/shellcheck"

      - name: Put the pinned shellcheck first on PATH
        run: |
          echo "$GITHUB_WORKSPACE/shellcheck-bin" >> "$GITHUB_PATH"

      - name: Cache actionlint binary
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.os }}

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run:
          bash <(curl -s
          https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          "$ACTIONLINT_VERSION"

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: '.github/workflows actions'
          config: zizmor.yml
          # Findings show as log annotations. Advanced Security upload stays
          # off so this job needs no extra permissions.
          advanced-security: 'false'
          annotations: 'true'
