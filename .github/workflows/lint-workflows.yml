name: Lint Workflows

# This repo governs every pipeline's CI. Its own workflow YAML gets scanned
# on every change.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    env:
      ACTIONLINT_VERSION: '1.7.12'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache actionlint binary
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.os }}

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run:
          bash <(curl -s
          https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          "$ACTIONLINT_VERSION"

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: '.github/workflows actions'
          config: zizmor.yml
          # Findings show as log annotations. Advanced Security upload stays
          # off so this job needs no extra permissions.
          advanced-security: 'false'
          annotations: 'true'
