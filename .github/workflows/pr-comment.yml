name: pr-comment

# Reusable workflow: a pipeline calls this from a stub with 'on: workflow_run'
# (see README.md) to post or update a pull request comment after one of its
# own workflows finishes.
#
# 'workflow_run' always runs in the base repository, with this job's own
# write token, after the producing workflow has already finished. Everything
# the producing workflow's job wrote came from a job that may have run pull
# request code; this workflow never runs any of it. It downloads a
# plain-text artifact from the exact run that triggered it, and hands that,
# untouched, to the 'post-comment' action, which validates every field
# before using it. See README.md's security model section and the action's
# own doc comments for what that validation covers.
#
# One job. It never checks out anything, so there is no 'unprivileged' half
# to separate it from: the whole job only ever reads a plain-text artifact
# and calls the GitHub API, and 'post-comment' never executes anything the
# artifact contains.
on:
  workflow_call:

# Two runs racing to post the same comment is the failure this prevents:
# each finds no existing comment and creates one, and later runs then update
# only the first, so the second is stranded as a stale report (see
# README.md).
#
# The group keys on the triggering run's head repository, head branch and
# producing workflow. The pull request number itself needs an API call and a
# group name cannot make one, but that triple is as precise: two runs of the
# same producer on the same branch are the pair that can collide, because
# they carry the same comment marker. Different producers write different
# markers, so they never conflict and do not need to queue behind each
# other.
#
# The group lives on the reusable workflow, so every caller inherits it and
# a fix still lands in one place. cancel-in-progress stays false: cancelling
# here drops a report instead of posting it, which is worse than a run
# waiting its turn.
concurrency:
  group:
    pr-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.name
    }}
  cancel-in-progress: false

permissions: {}

jobs:
  post-comment:
    name: post-comment
    # 'workflow_run' fires for every event the calling workflow supports.
    # 'head_sha' and the pull-request verification below are only
    # meaningful for a run that itself ran on 'pull_request'.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Reads the artifact from the run that triggered this workflow, not
      # from this job's own run: a cross-run download needs 'actions: read'
      # even within the same repository.
      actions: read
      # Verifies the artifact's claimed pull request number against the
      # commit's own associated pull requests, and creates or updates the
      # comment. GitHub maps this scope onto the Issues API comment
      # endpoints too, which is what a pull request comment actually is.
      pull-requests: write
    steps:
      # No 'if-no-files-found' input exists for a cross-run download, and
      # this artifact is legitimately absent whenever the producing job
      # never uploaded one (see README.md) - that is the normal case, not
      # an error. Asking the API first, instead of downloading and using
      # continue-on-error to paper over any failure, keeps that normal case
      # separate from a real one: a rate limit or an expired-artifact error
      # here still fails this job, instead of silently looking identical to
      # "no artifact" and never reaching the pull request.
      - name: Check whether the pr-comment artifact exists
        id: check-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          exists=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-comment" and .expired == false)] | length > 0')
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Download pr-comment artifact
        if: steps.check-artifact.outputs.exists == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-comment
          path: ${{ runner.temp }}/pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the pull request comment
        uses: $/actions/post-comment
        with:
          artifact-path: ${{ runner.temp }}/pr-comment
          github-token: ${{ github.token }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
