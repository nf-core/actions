name: linting

# Reusable workflow: replaces a pipeline's own 'linting.yml' and, for a
# pipeline that carries one, its separate 'nextflow-lint.yml'. Three checks,
# folded into one file instead of two: prek (formatting and misc hooks,
# defined in the pipeline's own '.pre-commit-config.yaml'), 'nf-core
# pipelines lint', and the Nextflow strict-syntax lint. See README.md for
# the pipeline stub and the .nf-core.yml keys it reads.
#
# No job here is privileged: every job reads only pull request code with
# 'contents: read' and no secret. 'nf-core' is the only job that produces a
# result meant for a PR comment; it writes the 'pr-comment' artifact for
# stage 7's poster workflow to pick up, and never posts a comment itself.
#
# One stub now covers two former triggers: 'pull_request' and 'release' (for
# 'pre-commit' and 'nf-core', as before) plus 'push' to the default and
# release branches (for 'nextflow-lint', as before). Each job below gates on
# 'github.event_name' to keep exactly the old per-check trigger set even
# though all three now share one 'on:' block. See README.md's migration
# note for the check names this changes.
#
# 'confirm-pass' is the check to put in branch protection, not the jobs
# above: GitHub treats a required check that reports 'skipped' as
# satisfied, and 'config' failing (a malformed .nf-core.yml, for example)
# skips every job that 'needs: config' below, so requiring one of those
# directly would let a broken config file bypass linting entirely.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Resolves the settings every job below needs, once, on a plain runner:
  # none of these jobs touch the pipeline's own compute hardware, so none of
  # them need the config-driven 'runner' setting.
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nextflow-versions: ${{ steps.read-config.outputs.nextflow-versions }}
      nf-core-version: ${{ steps.read-config.outputs.nf-core-version }}
      nextflow-lint: ${{ steps.read-config.outputs.nextflow-lint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CI configuration
        id: read-config
        uses: $/actions/read-config

  pre-commit:
    name: pre-commit
    needs: config
    # Only ran on 'pull_request' and 'release' before; skip on 'push'.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ fromJSON(needs.config.outputs.nextflow-versions)[0] }}

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  nf-core:
    name: nf-core
    needs: config
    # Only ran on 'pull_request' and 'release' before; skip on 'push'.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ fromJSON(needs.config.outputs.nextflow-versions)[0] }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # nf-core-version comes from 'nf_core_version' in the pipeline's
      # .nf-core.yml. Two values reach the install step below with no
      # matching PyPI release: empty (the key is missing, so 'uv tool
      # install' gets 'nf-core==' and a parse error far from this comment)
      # and a development suffix such as '3.4.2dev' (nf-core/tools' own
      # in-progress version, never itself released). Fail here, naming the
      # setting and what to set, instead of letting 'uv' fail cryptically.
      - name: Guard the nf-core version before install
        env:
          NF_CORE_VERSION: ${{ needs.config.outputs.nf-core-version }}
        run: |
          if [ -z "$NF_CORE_VERSION" ]; then
            echo "::error::'nf_core_version' is not set in .nf-core.yml (read by read-config as nf-core-version). Set it to a released nf-core/tools version, for example '4.0.3'." >&2
            exit 1
          fi
          case "$NF_CORE_VERSION" in
            *dev)
              echo "::error::'nf_core_version' in .nf-core.yml is '$NF_CORE_VERSION', a development version with no matching release on PyPI. Set it to a released nf-core/tools version, without the 'dev' suffix." >&2
              exit 1
              ;;
          esac

      - name: Install nf-core
        env:
          NF_CORE_VERSION: ${{ needs.config.outputs.nf-core-version }}
        run: uv tool install "nf-core==${NF_CORE_VERSION}"

      # A release pull request (base 'master' or 'main') gets the stricter
      # '--release' checks; every other pull request and a 'release' event
      # (no base ref at all) get the ordinary run.
      - name: Run nf-core pipelines lint
        if: github.base_ref != 'master' && github.base_ref != 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run:
          nf-core -l lint_log.txt pipelines lint --dir "$GITHUB_WORKSPACE"
          --markdown lint_results.md

      - name: Run nf-core pipelines lint --release
        if: github.base_ref == 'master' || github.base_ref == 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run:
          nf-core -l lint_log.txt pipelines lint --release --dir
          "$GITHUB_WORKSPACE" --markdown lint_results.md

      # Build a comment for stage 7's pr-comment.yml poster to publish on
      # the pull request. 'comment.md' is absent when the lint steps above
      # never ran or failed before nf-core wrote its report; stage 7 must
      # treat that as "nothing to say", not as an error. Gated on
      # 'pull_request': a 'release' run has no PR to comment on, and
      # 'pr_number.txt' would be blank.
      - name: Prepare PR comment artifact
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-comment
          echo "$PR_NUMBER" > pr-comment/pr_number.txt
          echo "lint" > pr-comment/header.txt
          [ -f lint_results.md ] && cp lint_results.md pr-comment/comment.md || true

      - name: Upload linting log artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linting-logs
          path: |
            lint_log.txt
            lint_results.md

      - name: Upload PR comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment
          path: pr-comment/

  nextflow-lint:
    name: nextflow-lint
    needs: config
    # Only ran on 'pull_request' and 'push' before; skip on 'release'. Also
    # opt-in: 'ci.nextflow_lint' in .nf-core.yml defaults to false, so a
    # pipeline adopting 'linting.yml' does not gain a new failing check
    # until it sets that key. See README.md for how to opt in.
    if:
      github.event_name != 'release' &&
      fromJSON(needs.config.outputs.nextflow-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ fromJSON(needs.config.outputs.nextflow-versions)[0] }}

      # Nextflow's own default exclude list already covers the generated
      # and tool directories every pipeline has ('.git', '.nf-test',
      # 'nf-test.config', 'work', ...). No pipeline has needed a different
      # list since; add a 'ci.nextflow_lint_exclude' setting here if one
      # genuinely does.
      - name: Nextflow strict syntax lint
        run: nextflow lint -o concise .

  # Single, stable check name for branch protection: it reports the combined
  # result of every job above, and always runs so the check exists even when
  # one of them was skipped or failed. Put this check in branch protection,
  # not 'config', 'pre-commit', 'nf-core' or 'nextflow-lint' individually:
  # GitHub treats a required check that reports 'skipped' as satisfied, and
  # any of those can report 'skipped', either by design (an event-gated 'if:'
  # above, or the opt-in 'nextflow-lint') or because 'config' failed and
  # every job that 'needs' it was skipped as a result.
  confirm-pass:
    name: confirm-pass
    needs: [config, pre-commit, nf-core, nextflow-lint]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if a required job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
