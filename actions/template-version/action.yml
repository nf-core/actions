name: Compare template version
description: >-
  Compares the pipeline's configured nf-core/tools version against the latest
  nf-core/tools release, and writes a 'pr-comment' artifact: a comment only when
  the pipeline is behind. Never posts anything itself.
author: nf-core

inputs:
  nf-core-version:
    description: >-
      The pipeline's configured nf-core/tools version, normally read-config's
      own 'nf-core-version' output. Empty is treated as 'unknown', not as
      'behind': nothing is posted.
    required: false
    default: ''
  pr-number:
    description: Pull request number to record in pr_number.txt.
    required: true
  github-token:
    description: >-
      Token used to read nf-core/tools' latest release. The ephemeral, per-job
      GITHUB_TOKEN is enough: nf-core/tools is a public repository, so this
      needs no elevated scope, only a token to raise the request above the
      unauthenticated rate limit.
    required: true
  artifact-path:
    description: Directory to write the 'pr-comment' artifact files into.
    required: false
    default: pr-comment

runs:
  using: node24
  main: dist/index.js
