name: Run nf-test shard
description: >-
  Runs one shard of a pipeline's nf-test suite and reports the result as a job
  summary and outputs. nf-test must already be installed and on PATH; this
  action does not install it, or any other tool. Tool setup (Nextflow, nf-test,
  Python, a container engine) is the calling workflow's job.
author: nf-core

inputs:
  profile:
    description: >-
      nf-test profile, without the leading '+'. Passed as '--profile=+<value>'.
      Must not be empty.
    required: true
  shard:
    description: This shard's number, 1-based. Must be a positive integer.
    required: true
  total-shards:
    description: >-
      Total number of shards. Must be a positive integer, and at least 'shard'.
    required: true
  tags:
    description: >-
      Tags for nf-test's '--tag' argument. Passed through as a single argument,
      never built into a shell string, so it is safe even if it contains shell
      metacharacters. Omitted from the command when empty.
    required: false
  changed-since:
    description: >-
      Git ref for nf-test's '--changed-since' argument. Defaults to 'HEAD^' when
      not supplied at all. An explicit empty value omits the flag, so every test
      runs.
    required: false
  verbose:
    description: Adds nf-test's '--verbose' flag. 'true' or 'false'.
    required: false
    default: 'true'
  extra-args:
    description: >-
      Extra nf-test arguments, as a JSON array of strings, for example
      '["--follow-dependencies"]'. Each element reaches nf-test as its own
      argument. A plain string is rejected, so an argument with a space in it
      can't be silently split apart. Use this for a pipeline with unusual
      nf-test needs, instead of forking the calling workflow.
    required: false

outputs:
  total:
    description:
      Number of tests reported in this shard's TAP output, as a plain number in
      a string.
  passed:
    description: Number of tests that passed, as a plain number in a string.
  failed:
    description: Number of tests that failed, as a plain number in a string.
  todo:
    description: Number of tests marked TODO, as a plain number in a string.
  skip:
    description: Number of tests marked SKIP, as a plain number in a string.
  skipped:
    description: >-
      Number of tests skipped or marked TODO, as a plain number in a string. The
      sum of 'todo' and 'skip'.
  tap-path:
    description: Absolute path to the TAP file this shard's nf-test run wrote.
  exit-code:
    description: nf-test's own exit code, as a plain number in a string.
  bailed-out:
    description: >-
      Whether nf-test's TAP output contained a 'Bail out!' line, as the string
      'true' or 'false'.

runs:
  using: node24
  main: dist/index.js
