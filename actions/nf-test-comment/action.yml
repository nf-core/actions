name: Build nf-test PR comment
description: >-
  Assembles a 'pr-comment' artifact reporting nf-test legs that failed against
  Nextflow's floating 'latest' version, from the fragment files the matrix job
  wrote. Writes a comment only when at least one fragment exists; writes
  resolved.md otherwise, so an earlier failure comment is updated away once
  every leg passes again. Never posts anything itself.
author: nf-core

inputs:
  fragments-path:
    description: >-
      Directory holding the downloaded failed-leg fragment files, one per failed
      leg. Treated as empty when this directory does not exist: that is the
      normal case when no leg failed.
    required: true
  run-url:
    description: Link to the full run, included in the comment for detail.
    required: true
  pr-number:
    description: Pull request number to record in pr_number.txt.
    required: true
  artifact-path:
    description: Directory to write the 'pr-comment' artifact files into.
    required: false
    default: pr-comment

runs:
  using: node24
  main: dist/index.js
