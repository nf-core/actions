name: Plan test run
description: >-
  Decides the nf-test profile set and changed-since value for a run, from the
  workflow's variant, event, and base ref. A pure decision: no file reads, no
  process calls, no network.
author: nf-core

inputs:
  profiles:
    description: >-
      Configured profiles, as a JSON array of strings, for example
      '["docker","singularity"]'. Normally read-config's 'profiles' output.
    required: true
  variant:
    description: >-
      The calling workflow's 'variant' input. Empty means the default flavour,
      which runs the full profile set on a release run. Any other value (for
      example 'arm', 'gpu') always reduces to a single profile.
    required: false
    default: ''
  event-name:
    description: The triggering event, normally 'github.event_name'.
    required: true
  base-ref:
    description: >-
      Pull request base branch, normally 'github.base_ref'. Empty for events
      that are not a pull request.
    required: false
    default: ''

outputs:
  test-profiles:
    description: >-
      Profiles this run should use, as a JSON array of strings. Use fromJSON()
      to build a matrix.
  changed-since:
    description: >-
      Value for nf-test's '--changed-since', as a plain string. Empty means
      "test everything".

runs:
  using: node24
  main: dist/index.js
