name: Verify an offline pipeline run
description: >-
  Compares a container cache directory's contents from before and after a
  downloaded pipeline ran. Fails when the run pulled an image that was not
  already cached, meaning 'nf-core pipelines download' did not bundle everything
  the pipeline needs to run offline.
author: nf-core

inputs:
  before-path:
    description: >-
      Path to a file listing the cache directory's contents before the run, one
      filename per line (for example 'ls -1' output).
    required: true
  after-path:
    description: >-
      Path to a file listing the cache directory's contents after the run, in
      the same format as 'before-path'.
    required: true

runs:
  using: node24
  main: dist/index.js
