name: Get nf-test shards
description: >-
  Runs an nf-test dry run and works out how many shards a CI run needs, from the
  number of tests nf-test would execute. nf-test must already be installed and
  on PATH; this action does not install it.
author: nf-core

inputs:
  max-shards:
    description:
      Upper bound on the number of shards. Must be a positive integer.
    required: true
  profile:
    description: >-
      nf-test profile for the dry run, without the leading '+'. For example
      'docker' runs nf-test with '--profile +docker'.
    required: false
    default: docker
  tags:
    description: >-
      Tags for nf-test's '--tag' argument. Passed through as a single argument,
      never built into a shell string, so it is safe even if it contains shell
      metacharacters. Omitted from the command when empty.
    required: false
  changed-since:
    description: >-
      Git ref for nf-test's '--changed-since' argument. An empty value omits the
      flag, so every test is considered.
    required: false
    default: HEAD^

outputs:
  shards:
    description: >-
      Shard numbers to run, as a JSON array of numbers, for example '[1,2,3]'.
      '[]' when there are no tests to run. Use fromJSON() to build a matrix.
  total-shards:
    description: >-
      Number of shards, as a plain number in a string, for example '3'. '0' when
      there are no tests to run.
  has-tests:
    description: >-
      Whether there are tests to run, as the string 'true' or 'false'. Compare
      it with `== 'true'` to skip a matrix job when there are none.

runs:
  using: node24
  main: dist/index.js
