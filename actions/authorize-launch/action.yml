name: Authorize AWS full test launch
description: >-
  Decides whether to launch the AWS full-scale test, and which revision to
  launch. On 'workflow_dispatch' or a published 'release', always. On a pull
  request review, only when the review is the exact one that brings the count of
  distinct, trusted (write-permission) approvals to the required threshold.
  Resolves permission through the GitHub API, not the review's
  'author_association'.
author: nf-core

inputs:
  event-name:
    description: The triggering event, as 'github.event_name'.
    required: true
  github-token:
    description:
      Token used to read collaborator permission and pull request reviews.
    required: true
  repository:
    description:
      This repository, full name (owner/repo), as 'github.repository'.
    required: true
  sha:
    description: >-
      Commit SHA to use as the revision for 'workflow_dispatch' and 'release',
      as 'github.sha'.
    required: true
  required-approvals:
    description: >-
      Number of distinct, trusted approvals required to launch, as a JSON
      number. Normally read-config's own 'awsfulltest-required-approvals'
      output.
    required: true
  review-state:
    description: >-
      'github.event.review.state'. Required, and checked, only for the
      pull_request_review event.
    required: false
  review-user:
    description: >-
      'github.event.review.user.login'. Required, and checked, only for the
      pull_request_review event.
    required: false
  review-id:
    description: >-
      'github.event.review.id'. Required, and checked, only for the
      pull_request_review event.
    required: false
  pr-number:
    description: >-
      'github.event.pull_request.number'. Required, and checked, only for the
      pull_request_review event.
    required: false
  pr-author:
    description: >-
      'github.event.pull_request.user.login'. Required, and checked, only for
      the pull_request_review event.
    required: false
  base-ref:
    description: >-
      'github.event.pull_request.base.ref'. Required, and checked, only for the
      pull_request_review event.
    required: false

outputs:
  should-run:
    description: "'true' or 'false'."
  revision:
    description: >-
      Revision to launch. Only meaningful when 'should-run' is 'true'; empty
      otherwise. The commit SHA for 'workflow_dispatch' or 'release'; the
      pipeline's own 'dev' branch for an approved pull request review. Never the
      pull request's own commits.

runs:
  using: node24
  main: dist/index.js
