name: Post a pull request comment
description: >-
  Posts or updates a pull request comment from a 'pr-comment' artifact an
  unprivileged workflow produced. Validates the artifact's header and pull
  request number, and independently verifies the pull request number against the
  commit that triggered the calling workflow, before posting anything. Never
  checks out or runs pull request code.
author: nf-core

inputs:
  artifact-path:
    description: >-
      Directory the 'pr-comment' artifact was downloaded into. A missing
      directory, or one with no pr_number.txt in it, is treated as 'nothing to
      post', not an error.
    required: true
  github-token:
    description: >-
      Token used to verify the pull request and to create or update the comment.
      Must be the ephemeral per-job GITHUB_TOKEN, with 'pull-requests: write':
      it is required, not merely sufficient. A long-lived token (for example a
      personal access token, often used so a bot comment triggers other
      workflows) lets an attacker-controlled comment body chain into those
      workflows instead; see README.md's Token section.
    required: true
  head-sha:
    description: >-
      Commit SHA to verify the artifact's claimed pull request number against,
      normally 'github.event.workflow_run.head_sha'.
    required: true

runs:
  using: node24
  main: dist/index.js
