name: Check pull request branch
description: >-
  Decides whether a pull request's source branch is one this pipeline's release
  branch accepts, and writes a 'pr-comment' artifact reporting the result. Fails
  the action itself when the source is not allowed; never posts a comment.
author: nf-core

inputs:
  event-name:
    description: >-
      Event that triggered this workflow. Normally 'github.event_name'. This
      action only supports 'pull_request'; it fails with a clear message
      otherwise, rather than being skipped by a job-level 'if'.
    required: true
  head-repo:
    description: >-
      Pull request head repository, full name (owner/repo). Normally
      'github.event.pull_request.head.repo.full_name'.
    required: true
  head-ref:
    description: >-
      Pull request head branch. Normally 'github.event.pull_request.head.ref'.
    required: true
  base-ref:
    description: >-
      Pull request base branch, recorded in the comment when the source is not
      allowed. Normally 'github.event.pull_request.base.ref'.
    required: true
  repository:
    description: >-
      This pipeline's own canonical repository, full name (owner/repo). Normally
      'github.repository'.
    required: true
  pr-user:
    description: >-
      Pull request author's login, recorded in the comment when the source is
      not allowed. Normally 'github.event.pull_request.user.login'.
    required: true
  pr-number:
    description: Pull request number to record in pr_number.txt.
    required: true
  artifact-path:
    description: Directory to write the 'pr-comment' artifact files into.
    required: false
    default: pr-comment

runs:
  using: node24
  main: dist/index.js
