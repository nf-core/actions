name: Announce a release
description: >-
  Composes a release announcement from a GitHub release payload and posts it to
  one channel, either Mastodon or Bluesky. Truncates the composed text to fit
  the channel's own length limit.
author: nf-core

inputs:
  channel:
    description: "Channel to post to: 'mastodon' or 'bluesky'."
    required: true
  tag-name:
    description: "The release's tag, as 'github.event.release.tag_name'."
    required: true
  release-name:
    description: >-
      The release's title, as 'github.event.release.name'. Empty when the
      release has no title, or is the same as the tag.
    required: false
  body:
    description: >-
      The release's notes, as 'github.event.release.body'. Empty when the
      release has no body.
    required: false
  html-url:
    description: "The release's URL, as 'github.event.release.html_url'."
    required: true
  prerelease:
    description: >-
      Whether this is a pre-release, as 'true' or 'false', from
      'github.event.release.prerelease'. Empty is treated as 'false'.
    required: false
  pipeline-name:
    description: >-
      Pipeline display name. Normally read-config's own 'pipeline-name' output.
      Falls back to 'repository' (its part after the last '/') when empty, true
      for a pipeline that pre-dates 'template.name'.
    required: false
  repository:
    description: >-
      This repository, full name (owner/repo), as 'github.repository'. Used as a
      display-name fallback when 'pipeline-name' is empty.
    required: true
  max-length:
    description: >-
      Maximum length of the posted text, in UTF-16 code units, as a JSON number.
      Mastodon's own default limit is 500; Bluesky's protocol limit is 300.
    required: true
  mastodon-host:
    description: >-
      Mastodon instance host, for example 'mstdn.science'. Required, and used,
      only when 'channel' is 'mastodon'. Must be a bare host name: a value
      containing a scheme or a slash is rejected.
    required: false
  mastodon-token:
    description: >-
      Mastodon access token. Required, and used, only when 'channel' is
      'mastodon'.
    required: false
  bluesky-identifier:
    description: >-
      Bluesky account handle or DID. Required, and used, only when 'channel' is
      'bluesky'.
    required: false
  bluesky-password:
    description: >-
      Bluesky app password (not the account's main password). Required, and
      used, only when 'channel' is 'bluesky'.
    required: false

outputs:
  post-url:
    description: Public URL of the posted status or post.

runs:
  using: node24
  main: dist/index.js
